; ============================================================================
;  ABU Auto Thailand V3  --  PlatformIO multi-board project
; ============================================================================
;
;   Role              env            source folder        MCU
;   ----------------  -------------  -------------------  ---------------------
;   Main controller   master         src/master/          Teensy 4.1
;   Sensor hub        slave_hub      src/slave_hub/       Teensy 4.1
;   Arm controller    slave_arm      src/slave_arm/       Blackpill STM32F411CE
;   Wheel driver      slave_wheel    src/slave_wheel/     Blackpill STM32F411CE
;
;   build one board    :  pio run -e master
;   upload one board   :  pio run -e master -t upload
;   serial monitor     :  pio device monitor -e master
;   build every board  :  pio run
;   clean              :  pio run -t clean
;
;  Headers live in include/<board>/, sources in src/<board>/.
;  Each env compiles ONLY its own folder (build_src_filter) and only sees its
;  own headers (-I include/<board>), so the four firmwares never see each
;  other's code even though they share one project. That is why every board
;  can have its own `config.h` without clashing.
; ============================================================================

[platformio]
src_dir      = src
include_dir  = include
default_envs = master, slave_hub, slave_arm, slave_wheel


; ---------------------------------------------------------------- common ---
[env]
framework     = arduino
monitor_speed = 115200


; ------------------------------------------------------------- Teensy 4.1 ---
[teensy41_base]
platform    = teensy
board       = teensy41
build_flags = -D USB_SERIAL


; --------------------------------------------------- Blackpill STM32F411CE ---
;  `Serial`  = USB CDC on the micro-USB connector (Serial Monitor)
;  `Serial1` = USART1 on PA9 (TX) / PA10 (RX)  ->  link to Master
;
;  Both are used at the same time, so `Serial` MUST be the USB CDC device --
;  that is what PIO_FRAMEWORK_ARDUINO_ENABLE_CDC + USBD_USE_CDC do here.
;  (Arduino IDE equivalent: Tools > USB support > "CDC supersede U(S)ART")
[blackpill_base]
platform        = ststm32
board           = blackpill_f411ce
upload_protocol = stlink
debug_tool      = stlink
; upload_protocol = dfu      ; <- swap to this to flash over USB with BOOT0
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USBD_USE_CDC


; ============================================================================
;  Environments
; ============================================================================

; Teensy 4.1 -- Master brain: mission runner, odometry, BNO085, all links.
[env:master]
extends          = teensy41_base
build_src_filter = -<*> +<master/>
build_flags      = ${teensy41_base.build_flags} -I include/master
lib_deps =
  adafruit/Adafruit BNO08x @ ^1.2

; Teensy 4.1 -- Sensor hub: RPLiDAR, 4x TFMini-S, relays, servos, switches.
[env:slave_hub]
extends          = teensy41_base
build_src_filter = -<*> +<slave_hub/>
build_flags      = ${teensy41_base.build_flags} -I include/slave_hub

; Blackpill F411CE -- Dual-axis arm with encoder PID + limit homing.
[env:slave_arm]
extends          = blackpill_base
build_src_filter = -<*> +<slave_arm/>
build_flags      = ${blackpill_base.build_flags} -I include/slave_arm

; Blackpill F411CE -- 4-wheel mecanum speed PID.
[env:slave_wheel]
extends          = blackpill_base
build_src_filter = -<*> +<slave_wheel/>
build_flags      = ${blackpill_base.build_flags} -I include/slave_wheel
